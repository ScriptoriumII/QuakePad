name: Tests, build et publication

on:
  push:
    branches: [main]
    tags: ["v*"]  # une étiquette vX.Y.Z publie une Release (installateur + empreintes)
  pull_request:
  workflow_dispatch:

# Moindre privilège : lecture seule ; seul le job « release » obtient le droit d'écrire.
permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # Windows : DPAPI et API Win32 réelles
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: windows
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # Actions épinglées par empreinte de commit (et non par étiquette modifiable)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Bibliothèques système pour Qt hors écran
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dépendances figées (empreintes vérifiées)
        run: python -m pip install --require-hashes --no-deps -r requirements.txt -r requirements-dev.txt
      - name: Analyse du code (ruff)
        run: |
          python -m ruff check quakepad tests
          python -m ruff format --check quakepad tests
      - name: Tests (pytest)
        run: python -m pytest -v

  windows-app:
    name: Exécutable et installateur Windows
    needs: tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Dépendances figées (empreintes vérifiées)
        run: python -m pip install --require-hashes --no-deps -r requirements.txt -r requirements-dev.txt
      - name: Version
        id: version
        run: |
          $v = python -c "import sys; sys.path.insert(0, '.'); from quakepad.settings import APP_VERSION; print(APP_VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "L'étiquette $($env:GITHUB_REF_NAME) ne correspond pas à APP_VERSION ($v)"
          }
      - name: PyInstaller (dossier, démarrage rapide)
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name QuakePad
          --icon assets\quakepad.ico --add-data "assets;assets" run_quakepad.py
      - name: Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.version }}" installer\QuakePad.iss
          if ($LASTEXITCODE -ne 0) { throw "Échec d'Inno Setup" }
      - name: Version portable (zip)
        run: Compress-Archive -Path dist\QuakePad\* -DestinationPath "dist\QuakePad-${{ steps.version.outputs.version }}-portable.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: QuakePad-windows
          path: |
            windows/dist/QuakePad-Setup-*.exe
            windows/dist/QuakePad-*-portable.zip

  chrome-extension:
    name: Extension Chrome
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Zip de l'extension
        run: cd chrome-extension && zip -r ../QuakePad-chrome-extension.zip .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: QuakePad-chrome-extension
          path: QuakePad-chrome-extension.zip

  release:
    name: Publication de la Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-app, chrome-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # création de la Release uniquement
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Empreintes SHA-256 (vérifiées par QuakePad avant toute installation)
        run: |
          cd artifacts
          sha256sum QuakePad-Setup-*.exe QuakePad-*-portable.zip QuakePad-chrome-extension.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Notes de version (message de l'étiquette annotée)
        run: |
          git fetch --force --tags origin || true
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          [ -s notes.md ] || echo "QuakePad $GITHUB_REF_NAME" > notes.md
      - name: Création de la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --repo "$GITHUB_REPOSITORY" --title "QuakePad ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
