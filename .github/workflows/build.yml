name: Tests et build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Moindre privilège : lecture seule du dépôt.
permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # Windows : DPAPI et API Win32 réelles
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: windows
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # Actions épinglées par empreinte de commit (et non par étiquette modifiable)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Bibliothèques système pour Qt hors écran
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dépendances figées (empreintes vérifiées)
        run: python -m pip install --require-hashes --no-deps -r requirements.txt -r requirements-dev.txt
      - name: Analyse du code (ruff)
        run: |
          python -m ruff check quakepad tests
          python -m ruff format --check quakepad tests
      - name: Tests (pytest)
        run: python -m pytest -v

  windows-app:
    name: Exécutable Windows
    needs: tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Dépendances figées (empreintes vérifiées)
        run: python -m pip install --require-hashes --no-deps -r requirements.txt -r requirements-dev.txt
      - name: PyInstaller
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name QuakePad
          --icon assets\quakepad.ico --add-data "assets;assets" run_quakepad.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: QuakePad-windows
          path: windows/dist/QuakePad.exe

  chrome-extension:
    name: Extension Chrome
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Zip de l'extension
        run: cd chrome-extension && zip -r ../QuakePad-chrome-extension.zip .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: QuakePad-chrome-extension
          path: QuakePad-chrome-extension.zip
